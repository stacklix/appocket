name: sentra
description: A local-first language learning app with direct AI access.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  http: ^1.5.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
